# Deploy to Azure Container Apps: builds the repo's image, pushes it to Azure Container Registry and
# points an existing Container App at it. How to set one up: README, "deploy-azure-container-app.yml".
#
# Keyless only. It signs in with GitHub's OpenID Connect token, which Azure accepts only if the app's
# deploy identity has a federated credential trusting this repo and the GitHub environment named in
# `environment`. There is no input for a client secret, on purpose. The caller must grant
# `id-token: write`, because a reusable workflow can't grant itself more than its caller has.
#
# The registry is reached with the same Entra sign-in (`az acr login`), never its admin password, so
# the registry's admin account can stay off. The Container App itself should pull with its own managed
# identity and AcrPull; that is set once on the app, not here.
#
# Actions are pinned to commits, and run scripts read inputs only through env vars, never ${{ }}
# inside the script.
name: Deploy to Azure Container Apps

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment to deploy as, such as staging or production. The deploy identity must have a federated credential for repo:<owner>/<repo>:environment:<this>."
        required: true
        type: string
      client_id:
        description: "Client ID of the app's deploy identity (a user-assigned managed identity). Not a secret: keep it in a repo variable, AZURE_CLIENT_ID."
        required: true
        type: string
      subscription_id:
        description: "Azure subscription that holds the app. Not a secret: keep it in a repo variable, AZURE_SUBSCRIPTION_ID."
        required: true
        type: string
      resource_group:
        description: "Resource group that holds the Container App."
        required: true
        type: string
      container_app:
        description: "Name of the existing Container App to update."
        required: true
        type: string
      registry:
        description: "Azure Container Registry name (without .azurecr.io) that receives the image."
        required: true
        type: string
      image_name:
        description: "Repository name for the image in the registry. Defaults to the repo name."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to the Dockerfile."
        required: false
        type: string
        default: "./Dockerfile"
      context:
        description: "Docker build context."
        required: false
        type: string
        default: "."
      tenant_id:
        description: "Entra tenant. Defaults to Stealth Labs."
        required: false
        type: string
        default: "64167dbd-b34e-473f-b604-3abb9be1292e"
    outputs:
      image:
        description: "The image reference that was deployed."
        value: ${{ jobs.deploy.outputs.image }}
      url:
        description: "The Container App's URL, if it has ingress."
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      image: ${{ steps.build.outputs.image }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure (keyless)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.client_id }}
          tenant-id: ${{ inputs.tenant_id }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Build and push the image
        id: build
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name || github.event.repository.name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          az acr login --name "$REGISTRY"
          login_server=$(az acr show --name "$REGISTRY" --query loginServer -o tsv)
          image="${login_server}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$image" -f "$DOCKERFILE" "$CONTEXT"
          docker push "$image"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Deploy to the Container App
        id: deploy
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          CONTAINER_APP: ${{ inputs.container_app }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --only-show-errors -o none
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          url=""
          if [ -n "$fqdn" ]; then url="https://${fqdn}"; fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to ${CONTAINER_APP}"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- URL: ${url:-no ingress}"
          } >> "$GITHUB_STEP_SUMMARY"

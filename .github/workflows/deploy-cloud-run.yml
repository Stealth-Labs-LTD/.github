name: Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      service_name:
        description: "Cloud Run service name (defaults to repo name)"
        required: false
        type: string
        default: ""
      region:
        description: "GCP region"
        required: false
        type: string
        default: "europe-west2"
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      port:
        description: "Container port"
        required: false
        type: string
        default: "8080"
      public:
        description: "Disable IAP and make service publicly accessible (for customer-facing apps)"
        required: false
        type: boolean
        default: false
      app_secret_prefix:
        description: "Prefix for caller secrets to auto-inject as Cloud Run env vars. The prefix is stripped from the var name (APP_ACCESS_SECRET -> ACCESS_SECRET)."
        required: false
        type: string
        default: "APP_"
      runtime_service_account:
        description: "Cloud Run runtime service account email (e.g. myapp-runtime@project.iam.gserviceaccount.com). When unset, Cloud Run assigns the default Compute SA, which has no project roles. Set this for any app that needs to authenticate to GCP APIs at runtime."
        required: false
        type: string
        default: ""
      project_id:
        description: "GCP project to deploy into. Defaults to the shared dev project. Another project only accepts the deploy if its own identity setup trusts the calling repo (see README: Deploying to another project)."
        required: false
        type: string
        default: "stealthlabs-dev"
      artifact_repository:
        description: "Artifact Registry repository (in project_id, europe-west2) that receives the image."
        required: false
        type: string
        default: "services"
      workload_identity_provider:
        description: "Keyless login: full Workload Identity Provider name (projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER). Set with service_account instead of passing GCP_SA_KEY. The caller must grant id-token: write."
        required: false
        type: string
        default: ""
      service_account:
        description: "Keyless login: the deploy service account to impersonate through workload_identity_provider."
        required: false
        type: string
        default: ""
      secret_env:
        description: "Env vars from Secret Manager in project_id, as comma-separated NAME=SECRET:VERSION pairs (e.g. DATABASE_URL=myapp-database-url:latest). The runtime service account needs Secret Accessor on each secret. A name must not also be set as an APP_ secret."
        required: false
        type: string
        default: ""
    secrets:
      GCP_SA_KEY:
        description: "Service account key JSON for stealthlabs-dev (org secret). Not needed with keyless login."
        required: false
      OPENROUTER_API_KEY:
        required: false
      all_secrets:
        description: "Pass the caller's toJSON(secrets) here to auto-inject app_secret_prefix-prefixed secrets as Cloud Run env vars. Omit for unchanged behaviour."
        required: false

env:
  PROJECT_ID: ${{ inputs.project_id }}
  REGISTRY: europe-west2-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Auto-classify the deploy from the caller's trigger so a GitHub
    # Deployment is recorded with environment_url populated. Downstream
    # consumers (catalogue, dashboards, notifiers) key off the env name +
    # the Deployments API to find the live URL without manual updates.
    #
    #   pull_request  -> preview    (shared env; each PR deploy is a
    #                                 separate Deployment record under it)
    #   anything else -> production
    #
    # The shared `preview` env keeps the Environments UI tidy (one entry
    # instead of N) and means PR cleanup never has to delete envs.
    # Per-PR traceability lives in the PR's own Deployments section + the
    # Deployments API (which records every deploy with its own ref/sha/url).
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      SERVICE_NAME: ${{ inputs.service_name || github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two ways in: the org's service account key (stealthlabs-dev), or keyless
      # login through a Workload Identity Provider. Which repos may deploy to a
      # project is decided by that project's identity setup, not by this file:
      # any repo can call this workflow, but a project only accepts tokens from
      # the repos its provider trusts.
      - name: Check deploy credentials
        env:
          HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          WIF_PROVIDER: ${{ inputs.workload_identity_provider }}
          WIF_SA: ${{ inputs.service_account }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -z "$WIF_SA" ]; then
            echo "::error::service_account is required with workload_identity_provider"
            exit 1
          fi
          if [ -z "$WIF_PROVIDER" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::Pass the GCP_SA_KEY secret, or the workload_identity_provider and service_account inputs"
            exit 1
          fi

      - name: Authenticate to Google Cloud (service account key)
        if: ${{ inputs.workload_identity_provider == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (keyless)
        if: ${{ inputs.workload_identity_provider != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -f ${{ inputs.dockerfile }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        env:
          ALL_SECRETS: ${{ secrets.all_secrets }}
          APP_SECRET_PREFIX: ${{ inputs.app_secret_prefix }}
          SECRET_ENV: ${{ inputs.secret_env }}
        run: |
          # Build env var list: release metadata first (tag-triggered deploys only),
          # then OpenRouter, then any APP_*-prefixed caller secrets (opt-in via
          # the all_secrets input). Uses ^|^ as the --set-env-vars delimiter so
          # values can contain commas.
          ENV_VARS_LIST=""

          # APP_VERSION / APP_SHA / APP_REPO are stamped only on tag-triggered
          # deploys so gcrdash can surface the release version. PR previews
          # and other non-tag callers are left untouched.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ENV_VARS_LIST="APP_VERSION=${GITHUB_REF_NAME}|APP_SHA=${GITHUB_SHA}|APP_REPO=${GITHUB_REPOSITORY}"
          fi

          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            ENV_VARS_LIST="${ENV_VARS_LIST:+$ENV_VARS_LIST|}OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
          fi

          if [ -n "$ALL_SECRETS" ]; then
            APP_VARS=$(echo "$ALL_SECRETS" | jq -r --arg p "$APP_SECRET_PREFIX" '
              to_entries
              | map(select(.key | startswith($p)))
              | map("\(.key | ltrimstr($p))=\(.value)")
              | join("|")
            ')
            if [ -n "$APP_VARS" ]; then
              ENV_VARS_LIST="${ENV_VARS_LIST:+$ENV_VARS_LIST|}$APP_VARS"
            fi
          fi

          if [ -n "$ENV_VARS_LIST" ]; then
            ENV_VARS="--set-env-vars=^|^$ENV_VARS_LIST"
          else
            ENV_VARS=""
          fi

          IAP_FLAG="${{ inputs.public && '--no-iap' || '--iap' }}"
          AUTH_FLAG="${{ inputs.public && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}"

          SA_FLAG=""
          if [ -n "${{ inputs.runtime_service_account }}" ]; then
            SA_FLAG="--service-account=${{ inputs.runtime_service_account }}"
          fi

          # Secret Manager references stay out of the service's plain config.
          # Whitespace is dropped so callers can list one pair per line.
          SECRETS_FLAG=""
          SECRET_ENV=$(printf '%s' "$SECRET_ENV" | tr -d '[:space:]')
          if [ -n "$SECRET_ENV" ]; then
            SECRETS_FLAG="--set-secrets=$SECRET_ENV"
          fi

          URL=$(gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ inputs.region }} \
            --port=${{ inputs.port }} \
            --platform=managed \
            $ENV_VARS \
            $IAP_FLAG \
            $AUTH_FLAG \
            $SA_FLAG \
            $SECRETS_FLAG \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Grant IAP service agent access
        if: ${{ !inputs.public }}
        run: |
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format='value(projectNumber)')
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region=${{ inputs.region }} \
            --project=${{ env.PROJECT_ID }} \
            --member="serviceAccount:service-${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" \
            --role=roles/run.invoker 2>/dev/null || true

      - name: Job summary
        run: |
          echo "## Deployed to Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Service** | \`${{ env.SERVICE_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Project** | \`${{ env.PROJECT_ID }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Login** | ${{ inputs.workload_identity_provider != '' && 'Keyless (Workload Identity)' || 'Service account key' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | ${{ steps.deploy.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${{ github.event_name == 'pull_request' && 'preview' || 'production' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Region** | \`${{ inputs.region }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image** | \`${{ env.SERVICE_NAME }}:${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Auth** | ${{ inputs.public && 'Public (no IAP)' || 'IAP protected (team only)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Runtime SA** | ${{ inputs.runtime_service_account || 'default Compute SA' }} |" >> "$GITHUB_STEP_SUMMARY"

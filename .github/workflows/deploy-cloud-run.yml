name: Deploy to Cloud Run

# For proofs of concept, demos, PR previews and internal tools that hold public
# or internal data only. The defaults (shared stealthlabs-dev project, shared
# GCP_SA_KEY, one org-wide OPENROUTER_API_KEY) suit that and nothing more.
# Customer work ships into the customer's environment; HQ apps run on Azure.
# See the README ("deploy-cloud-run.yml") for what to harden as an app grows.

on:
  workflow_call:
    inputs:
      service_name:
        description: "Cloud Run service name (defaults to repo name)"
        required: false
        type: string
        default: ""
      region:
        description: "GCP region"
        required: false
        type: string
        default: "europe-west2"
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      port:
        description: "Container port"
        required: false
        type: string
        default: "8080"
      public:
        description: "Disable IAP and make the service publicly accessible (for example a demo shared with a customer)"
        required: false
        type: boolean
        default: false
      app_secret_prefix:
        description: "Prefix for caller secrets to auto-inject as Cloud Run env vars. The prefix is stripped from the var name (APP_ACCESS_SECRET -> ACCESS_SECRET)."
        required: false
        type: string
        default: "APP_"
      runtime_service_account:
        description: "Cloud Run runtime service account email (e.g. myapp-runtime@project.iam.gserviceaccount.com). When unset, Cloud Run assigns the default Compute SA, which has no project roles. Set this for any app that needs to authenticate to GCP APIs at runtime."
        required: false
        type: string
        default: ""
      project_id:
        description: "GCP project to deploy into. Defaults to the shared dev project. Another project only accepts the deploy if its own identity setup trusts the calling repo (see README: Deploying to another project)."
        required: false
        type: string
        default: "stealthlabs-dev"
      artifact_repository:
        description: "Artifact Registry repository (in project_id, europe-west2) that receives the image."
        required: false
        type: string
        default: "services"
      workload_identity_provider:
        description: "Keyless login: full Workload Identity Provider name (projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER). Set with service_account instead of passing GCP_SA_KEY. The caller must grant id-token: write."
        required: false
        type: string
        default: ""
      service_account:
        description: "Keyless login: the deploy service account to impersonate through workload_identity_provider."
        required: false
        type: string
        default: ""
      secret_env:
        description: "Env vars from Secret Manager in project_id, as NAME=SECRET:VERSION pairs separated by commas or new lines (e.g. DATABASE_URL=myapp-database-url:latest). The runtime service account needs Secret Accessor on each secret. A name must not also be set as an APP_ secret."
        required: false
        type: string
        default: ""
    secrets:
      GCP_SA_KEY:
        description: "Service account key JSON for stealthlabs-dev (org secret). Not needed with keyless login."
        required: false
      OPENROUTER_API_KEY:
        required: false
      all_secrets:
        description: "Pass the caller's toJSON(secrets) here to auto-inject app_secret_prefix-prefixed secrets as Cloud Run env vars. Omit for unchanged behaviour."
        required: false

env:
  PROJECT_ID: ${{ inputs.project_id }}
  REGISTRY: europe-west2-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Auto-classify the deploy from the caller's trigger so a GitHub
    # Deployment is recorded with environment_url populated. Downstream
    # consumers (catalogue, dashboards, notifiers) key off the env name +
    # the Deployments API to find the live URL without manual updates.
    #
    #   pull_request  -> preview    (shared env; each PR deploy is a
    #                                 separate Deployment record under it)
    #   anything else -> production
    #
    # The shared `preview` env keeps the Environments UI tidy (one entry
    # instead of N) and means PR cleanup never has to delete envs.
    # Per-PR traceability lives in the PR's own Deployments section + the
    # Deployments API (which records every deploy with its own ref/sha/url).
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      SERVICE_NAME: ${{ inputs.service_name || github.event.repository.name }}
    steps:
      # Actions are pinned to commits, and run scripts read inputs, secrets and
      # outputs only through env vars, never ${{ }} inside the script.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Two ways in: the org's service account key (stealthlabs-dev), or keyless
      # login through a Workload Identity Provider. Which repos may deploy to a
      # project is decided by that project's identity setup, not by this file:
      # any repo can call this workflow, but a project only accepts tokens from
      # the repos its provider trusts.
      - name: Check deploy credentials
        env:
          HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
          WIF_PROVIDER: ${{ inputs.workload_identity_provider }}
          WIF_SA: ${{ inputs.service_account }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -z "$WIF_SA" ]; then
            echo "::error::service_account is required with workload_identity_provider"
            exit 1
          fi
          if [ -z "$WIF_PROVIDER" ] && [ -n "$WIF_SA" ]; then
            echo "::error::service_account only applies to keyless login: set workload_identity_provider too, or remove service_account"
            exit 1
          fi
          if [ -z "$WIF_PROVIDER" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::Pass the GCP_SA_KEY secret, or the workload_identity_provider and service_account inputs"
            exit 1
          fi

      - name: Authenticate to Google Cloud (service account key)
        if: ${{ inputs.workload_identity_provider == '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (keyless)
        if: ${{ inputs.workload_identity_provider != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build Docker image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          docker build \
            -t "$REGISTRY/$SERVICE_NAME:$GITHUB_SHA" \
            -f "$DOCKERFILE" .

      - name: Push Docker image
        run: |
          docker push "$REGISTRY/$SERVICE_NAME:$GITHUB_SHA"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          ALL_SECRETS: ${{ secrets.all_secrets }}
          APP_SECRET_PREFIX: ${{ inputs.app_secret_prefix }}
          SECRET_ENV: ${{ inputs.secret_env }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEPLOY_REGION: ${{ inputs.region }}
          DEPLOY_PORT: ${{ inputs.port }}
          PUBLIC: ${{ inputs.public }}
          RUNTIME_SA: ${{ inputs.runtime_service_account }}
        run: |
          # Build env var list: release metadata first (tag-triggered deploys only),
          # then OpenRouter, then any APP_*-prefixed caller secrets (opt-in via
          # the all_secrets input). Uses ^|^ as the --set-env-vars delimiter so
          # values can contain commas.
          ENV_VARS_LIST=""

          # APP_VERSION / APP_SHA / APP_REPO are stamped only on tag-triggered
          # deploys so gcrdash can surface the release version. PR previews
          # and other non-tag callers are left untouched.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ENV_VARS_LIST="APP_VERSION=${GITHUB_REF_NAME}|APP_SHA=${GITHUB_SHA}|APP_REPO=${GITHUB_REPOSITORY}"
          fi

          if [ -n "$OPENROUTER_KEY" ]; then
            ENV_VARS_LIST="${ENV_VARS_LIST:+$ENV_VARS_LIST|}OPENROUTER_API_KEY=$OPENROUTER_KEY"
          fi

          if [ -n "$ALL_SECRETS" ]; then
            APP_VARS=$(echo "$ALL_SECRETS" | jq -r --arg p "$APP_SECRET_PREFIX" '
              to_entries
              | map(select(.key | startswith($p)))
              | map("\(.key | ltrimstr($p))=\(.value)")
              | join("|")
            ')
            if [ -n "$APP_VARS" ]; then
              ENV_VARS_LIST="${ENV_VARS_LIST:+$ENV_VARS_LIST|}$APP_VARS"
            fi
          fi

          # Optional flags go in an array so no value is ever split on spaces.
          ARGS=()
          if [ -n "$ENV_VARS_LIST" ]; then
            ARGS+=("--set-env-vars=^|^$ENV_VARS_LIST")
          fi

          if [ "$PUBLIC" = "true" ]; then
            ARGS+=(--no-iap --allow-unauthenticated)
          else
            ARGS+=(--iap --no-allow-unauthenticated)
          fi

          if [ -n "$RUNTIME_SA" ]; then
            ARGS+=("--service-account=$RUNTIME_SA")
          fi

          # Secret Manager references stay out of the service's plain config.
          # Pairs can be separated by commas or new lines: new lines become
          # commas, other whitespace is dropped, and empty pairs are removed.
          SECRET_ENV=$(printf '%s' "$SECRET_ENV" | tr '\n' ',' | tr -d '[:space:]' | sed -e 's/,,*/,/g' -e 's/^,//' -e 's/,$//')
          if [ -n "$SECRET_ENV" ]; then
            ARGS+=("--set-secrets=$SECRET_ENV")
          fi

          URL=$(gcloud run deploy "$SERVICE_NAME" \
            --image="$REGISTRY/$SERVICE_NAME:$GITHUB_SHA" \
            --region="$DEPLOY_REGION" \
            --port="$DEPLOY_PORT" \
            --platform=managed \
            "${ARGS[@]}" \
            --project="$PROJECT_ID" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Never fails the deploy, but says so: without this binding IAP can't reach
      # the service. The deploy account needs resourcemanager.projects.get and
      # run.services.setIamPolicy (Cloud Run Admin has both).
      - name: Grant IAP service agent access
        if: ${{ !inputs.public }}
        env:
          DEPLOY_REGION: ${{ inputs.region }}
        run: |
          if ! PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)'); then
            echo "::warning::Couldn't read the project number of $PROJECT_ID, so the IAP service agent wasn't given run.invoker on $SERVICE_NAME. IAP requests will fail until it is."
            exit 0
          fi
          if ! gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
            --region="$DEPLOY_REGION" \
            --project="$PROJECT_ID" \
            --member="serviceAccount:service-${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" \
            --role=roles/run.invoker --format=none; then
            echo "::warning::Couldn't give the IAP service agent run.invoker on $SERVICE_NAME. IAP requests will fail until it's granted."
          fi

      - name: Job summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          DEPLOY_REGION: ${{ inputs.region }}
          LOGIN: ${{ inputs.workload_identity_provider != '' && 'Keyless (Workload Identity)' || 'Service account key' }}
          ACCESS: ${{ inputs.public && 'Public (no IAP)' || 'IAP protected (team only)' }}
          RUNTIME_SA: ${{ inputs.runtime_service_account || 'default Compute SA' }}
        run: |
          {
            echo "## Deployed to Cloud Run"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Service** | \`$SERVICE_NAME\` |"
            echo "| **Project** | \`$PROJECT_ID\` |"
            echo "| **Login** | $LOGIN |"
            echo "| **URL** | $DEPLOY_URL |"
            echo "| **Environment** | \`$DEPLOY_ENVIRONMENT\` |"
            echo "| **Region** | \`$DEPLOY_REGION\` |"
            echo "| **Image** | \`$SERVICE_NAME:$GITHUB_SHA\` |"
            echo "| **Auth** | $ACCESS |"
            echo "| **Runtime SA** | $RUNTIME_SA |"
          } >> "$GITHUB_STEP_SUMMARY"

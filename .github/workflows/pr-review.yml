name: PR review

on:
  workflow_call:
    inputs:
      model:
        description: "Claude model for the review"
        required: false
        type: string
        default: "claude-opus-4-8"
      persona:
        description: "Review persona (a skill in the pr-review plugin, e.g. stealth-labs)"
        required: false
        type: string
        default: "stealth-labs"
      review_drafts:
        description: "Review draft PRs too (default: skip drafts, review once marked ready)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    # Skip draft PRs; the ready_for_review trigger runs it once the PR is marked ready.
    # Skip Dependabot PRs: GitHub withholds the normal secrets from Dependabot-triggered runs
    # (they use the separate Dependabot secret store), so the reviewer has no credential and fails.
    # A dependency version bump does not need an AI review in any case.
    if: ${{ github.actor != 'dependabot[bot]' && (inputs.review_drafts || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ai-dev-kit (the reviewer plugin marketplace) is an internal repo, so the
      # runner needs read access to clone it. A GitHub App installed on the org
      # (Contents: read on ai-dev-kit) mints a short-lived token per run, which is
      # cleaner than a long-lived PAT. Set SL_AI_DEV_KIT_APP_ID and
      # SL_AI_DEV_KIT_APP_KEY (the App's id and private key) as org secrets.
      - name: Mint ai-dev-kit token
        id: adk
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SL_AI_DEV_KIT_APP_ID }}
          private-key: ${{ secrets.SL_AI_DEV_KIT_APP_KEY }}
          owner: Stealth-Labs-LTD
          repositories: ai-dev-kit

      - name: Configure git for the internal plugin marketplace
        env:
          AI_DEV_KIT_TOKEN: ${{ steps.adk.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${AI_DEV_KIT_TOKEN}@github.com/Stealth-Labs-LTD".insteadOf \
            "https://github.com/Stealth-Labs-LTD"

      # Billing: by default the org secret PR_REVIEW_ANTHROPIC_API_KEY, an API key from the
      # Claude Console org that holds the startup credits. A repo that sets its own
      # CLAUDE_CODE_OAUTH_TOKEN secret opts out and is billed to that subscription instead.
      # Keep CLAUDE_CODE_OAUTH_TOKEN off the org secrets, or every repo switches to OAuth.
      # Only one credential is passed, so the action never has to choose between them.
      - name: Report billing mode
        env:
          USE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$USE_OAUTH" = "true" ]; then
            mode="OAuth token (repo secret CLAUDE_CODE_OAUTH_TOKEN)"
          else
            mode="API key (org secret PR_REVIEW_ANTHROPIC_API_KEY)"
          fi
          echo "Reviewer billed via: $mode" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.PR_REVIEW_ANTHROPIC_API_KEY || '' }}
          plugin_marketplaces: "https://github.com/Stealth-Labs-LTD/ai-dev-kit.git"
          plugins: "pr-review@ai-dev-kit"
          prompt: "/pr-review:${{ inputs.persona }} ${{ github.event.pull_request.number }}"
          claude_args: >-
            --model ${{ inputs.model }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

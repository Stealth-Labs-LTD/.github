name: PR review

on:
  workflow_call:
    inputs:
      model:
        description: "Claude model for the review"
        required: false
        type: string
        default: "claude-opus-4-8"

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    # Skip draft PRs; the ready_for_review trigger runs it once the PR is marked ready.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ai-dev-kit (the reviewer plugin marketplace) is an internal repo, so give
      # git a token to clone it. Set AI_DEV_KIT_TOKEN as an org secret with read
      # access to Stealth-Labs-LTD/ai-dev-kit. Skipped if the secret is absent.
      - name: Configure git for the internal plugin marketplace
        env:
          AI_DEV_KIT_TOKEN: ${{ secrets.AI_DEV_KIT_TOKEN }}
        run: |
          if [ -n "$AI_DEV_KIT_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${AI_DEV_KIT_TOKEN}@github.com/Stealth-Labs-LTD".insteadOf \
              "https://github.com/Stealth-Labs-LTD"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/Stealth-Labs-LTD/ai-dev-kit.git"
          plugins: "pr-review@ai-dev-kit"
          prompt: "/pr-review:pr-review ${{ github.event.pull_request.number }}"
          claude_args: >-
            --model ${{ inputs.model }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

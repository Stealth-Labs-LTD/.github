# Security baseline: the checks every pull request must pass, required org-wide by the
# `security-baseline` org ruleset. It can also be called with workflow_call, to try it in a repo
# before the ruleset applies there.
#
# It has to work on any stack with no set-up, and it blocks only on problems a pull request adds:
# every job compares the pull request with its base, so existing issues never turn an unrelated pull
# request red. Repos add their own, stricter checks alongside it. Per-repo tuning lives in each repo's
# own files (`.trivyignore`, `nosemgrep` comments, `osv-scanner.toml`), so it is reviewed like any change.
#
# Existing issues are still shown, without failing anything: the high and critical issues already on
# the base branch that the pull request leaves in place are listed in the run summary, with a warning
# on the check, for dependencies, code, workflow files and infrastructure. Existing secrets aren't
# listed, because finding them takes a scan of the whole history.
#
# Every action is pinned to a commit and the Semgrep image to a digest, each with its version in a
# comment. The tools some actions fetch (TruffleHog's and OSV-Scanner's images, zizmor and the Trivy
# binary) are pinned by version only. Tags can be moved: in March 2026, 76 of the 77 trivy-action tags
# were hijacked to steal CI secrets (CVE-2026-33634). Bump pins deliberately, and update the ruleset's
# pinned commit to match.
name: Security baseline

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

# github.workflow keeps the ruleset's run and a repo's own workflow_call run in separate groups, so
# neither cancels the other.
concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The event's base and head. The base recorded on a pull request can be behind the branch it targets,
# while the checked-out merge commit is built on that branch's current tip, so each job takes its base
# from the merge commit instead ("Find the base") and falls back to this only where there is no merge
# commit, as in a merge queue.
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
  # The branch the pull request targets, named in the reports of issues already there.
  BASE_NAME: ${{ github.base_ref || 'the base branch' }}

jobs:
  # Live and unverifiable secrets in the pull request's commits. Keys that fail verification, such as
  # revoked keys or test fixtures, are not reported. The org push ruleset and the repo-guardrails hook
  # catch secret files and known key formats earlier.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          base: ${{ env.BASE }}
          head: ${{ env.HEAD_SHA }}
          version: 3.99.8
          extra_args: --results=verified,unknown

  # Semgrep's default rules, high severity only, and only the findings the pull request adds. Mark a
  # checked false positive with a `nosemgrep` comment. Workflow files are left to the workflows job.
  code:
    name: code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 # 1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      - name: Semgrep on the whole pull request, for the report below
        continue-on-error: true
        run: |
          semgrep scan --config p/default --severity ERROR --metrics off --exclude .github/workflows --quiet --json --output "$RUNNER_TEMP/all.json"
      - name: Semgrep
        run: |
          semgrep scan --config p/default --severity ERROR --baseline-commit "$BASE" --error --metrics off --exclude .github/workflows \
            --json-output="$RUNNER_TEMP/new.json"
      # Report only: every finding in the pull request that the step above doesn't report as new.
      - name: List findings already on the base branch (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: python3 {0}
        run: |
          import json, os
          tmp, base = os.environ["RUNNER_TEMP"], os.environ["BASE_NAME"]
          def load(name):
              try:
                  return json.load(open(os.path.join(tmp, name)))["results"]
              except (OSError, ValueError, KeyError):
                  return None
          found, new = load("all.json"), load("new.json") or []
          if found is None:
              print("The full scan didn't finish, so there's nothing to report.")
              raise SystemExit(0)
          key = lambda r: (r["check_id"], r["path"], r["start"]["line"], r["start"]["col"])
          added = {key(r) for r in new}
          rows = sorted((r for r in found if key(r) not in added), key=lambda r: (r["path"], r["start"]["line"]))
          if not rows:
              print(f"No high-severity code findings already on {base}.")
              raise SystemExit(0)
          cell = lambda t: " ".join(str(t).split()).replace("|", "\\|")[:160]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Code findings already on {base} (not blocking)\n\n")
              out.write(f"{len(rows)} high-severity Semgrep findings. This pull request didn't add them, so they don't fail the check. Fix them in their own pull request.\n\n")
              out.write("| Rule | File | Finding |\n|---|---|---|\n")
              for r in rows[:50]:
                  out.write(f"| {cell(r['check_id'].split('.')[-1])} | {cell(r['path'])}:{r['start']['line']} | {cell(r['extra']['message'])} |\n")
              if len(rows) > 50:
                  out.write(f"\nAnd {len(rows) - 50} more.\n")
          print(f"::warning title=Existing code findings::{len(rows)} high-severity code findings are already on {base}. Not blocking. They're listed in the run summary.")

  # Known vulnerabilities in dependencies. OSV-Scanner scans the base and the pull request and fails only
  # on vulnerabilities the pull request adds; Dependabot handles the ones already there. Results go to
  # the job log and annotations, as private repos cannot take SARIF without GitHub Code Security. In a
  # merge queue it has no base branch to compare with and reports nothing new, so the pull request run
  # is the one that counts. Repos with no dependency files pass. `security-events: write` is granted only
  # because OSV-Scanner's reusable workflow declares it on its job; SARIF upload is off.
  dependencies:
    name: dependencies
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      scan-args: |-
        --recursive
        --allow-no-lockfiles
        ./

  # Report only: high and critical vulnerabilities (CVSS 7 or more) in both of the dependency scans
  # above, so already on the base branch and still there after the pull request. It reads the results
  # the scans uploaded, so nothing is scanned twice, and it never fails the run. Dependabot alerts
  # track these. A merge queue run has no base scan to compare with, so it reports nothing there.
  dependencies-existing:
    name: dependencies already on the base (report only)
    needs: dependencies
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-json-results"
          path: ${{ runner.temp }}/osv
          merge-multiple: true
      - name: List vulnerabilities already on the base branch
        shell: python3 {0}
        run: |
          import json, os
          tmp, base = os.path.join(os.environ["RUNNER_TEMP"], "osv"), os.environ["BASE_NAME"]
          def groups(name):
              try:
                  data = json.load(open(os.path.join(tmp, name)))
              except (OSError, ValueError):
                  return None
              found = {}
              for result in data.get("results") or []:
                  source = result["source"]["path"].removeprefix("/github/workspace/")
                  for pkg in result.get("packages") or []:
                      p = pkg["package"]
                      for g in pkg.get("groups") or []:
                          try:
                              score = float(g.get("max_severity") or 0)
                          except ValueError:
                              score = 0
                          if score < 7:
                              continue
                          ids = sorted(g["ids"])
                          names = sorted(set(g.get("aliases", []) + ids))
                          advisory = next((i for i in names if i.startswith("CVE-")), next((i for i in names if i.startswith("GHSA-")), ids[0]))
                          row = found.setdefault((p["ecosystem"], p["name"], ids[0]), {"score": score, "package": f"{p['name']} {p['version']}", "advisory": advisory, "files": set()})
                          row["files"].add(source)
              return found
          old, new = groups("old-results.json"), groups("new-results.json")
          if old is None or new is None:
              print("A dependency scan didn't finish, so there's nothing to report.")
              raise SystemExit(0)
          rows = sorted((v for k, v in new.items() if k in old), key=lambda v: (-v["score"], v["package"]))
          if not rows:
              print(f"No high or critical dependency vulnerabilities already on {base}.")
              raise SystemExit(0)
          critical = sum(v["score"] >= 9 for v in rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Dependency vulnerabilities already on {base} (not blocking)\n\n")
              out.write(f"{critical} critical and {len(rows) - critical} high. This pull request didn't add them, so they don't fail the check. Dependabot alerts track them. Fix them in their own pull request.\n\n")
              out.write("| Severity | Package | Advisory | File |\n|---|---|---|---|\n")
              for v in rows[:50]:
                  severity = "Critical" if v["score"] >= 9 else "High"
                  out.write(f"| {severity} ({v['score']:g}) | {v['package']} | {v['advisory']} | {', '.join(sorted(v['files']))} |\n")
              if len(rows) > 50:
                  out.write(f"\nAnd {len(rows) - 50} more.\n")
          print(f"::warning title=Existing dependency vulnerabilities::{critical} critical and {len(rows) - critical} high-severity dependency vulnerabilities are already on {base}. Not blocking. They're listed in the run summary.")

  # GitHub Actions security (script injection, risky triggers, over-broad permissions, unpinned
  # actions). zizmor audits the base and pull request versions of each workflow or action file the
  # pull request adds or changes, and the job fails only on high-severity findings that are new.
  # Findings are matched on rule, file, YAML location and message, not line number, so an edit
  # elsewhere in a file doesn't turn the file's existing findings into new ones.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      # Compare the base with the checked-out merge commit, not the branch head, so only the pull
      # request's own changes count even when its branch is behind the base.
      - name: List changed workflow and action files
        id: changed
        run: |
          files=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- \
            '.github/workflows/*.yml' '.github/workflows/*.yaml' ':(glob)**/action.yml' ':(glob)**/action.yaml' | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "Changed: ${files:-none}"
      # Installed even when no workflow file changed, for the report of existing issues below. The jq
      # filter writes one line per high-severity finding: rule, file, YAML route and message (the
      # match key), then the line number for the report.
      - name: Install zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check zizmor==1.32.0
          cat > "$RUNNER_TEMP/findings.jq" <<'EOF'
          .[] | select(.determinations.severity == "High") | . as $f
          | ([$f.locations[] | select(.symbolic.kind == "Primary")] + $f.locations)[0] as $l
          | [$f.ident, $l.symbolic.key.Local.verbatim_path, ($l.symbolic.route | tostring),
             $l.symbolic.annotation, ($l.concrete.location.start_point.row + 1 | tostring)] | @tsv
          EOF
      - name: zizmor, failing only on findings the pull request adds
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          FILES: ${{ steps.changed.outputs.files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor="$RUNNER_TEMP/zizmor/bin/zizmor"
          base_dir="$RUNNER_TEMP/zizmor-base"
          read -r -a files <<< "$FILES"
          # The base version of each changed file that existed before, at the same relative path.
          base_files=()
          for f in "${files[@]}"; do
            if git cat-file -e "$BASE:$f" 2>/dev/null; then
              mkdir -p "$base_dir/$(dirname "$f")"
              git show "$BASE:$f" > "$base_dir/$f"
              base_files+=("$f")
            fi
          done
          findings() { jq -r -f "$RUNNER_TEMP/findings.jq"; }
          "$zizmor" --format json --min-severity high --no-exit-codes "${files[@]}" | findings > "$RUNNER_TEMP/head.tsv"
          : > "$RUNNER_TEMP/base.tsv"
          if [ "${#base_files[@]}" -gt 0 ]; then
            (cd "$base_dir" && "$zizmor" --format json --min-severity high --no-exit-codes "${base_files[@]}") | findings > "$RUNNER_TEMP/base.tsv"
          fi
          cut -f1-4 "$RUNNER_TEMP/base.tsv" | sort -u > "$RUNNER_TEMP/base.keys"
          # FILENAME, not NR == FNR: when the base has no findings, base.keys is empty and NR == FNR
          # holds for every head line too, which would mark every finding as already in the base.
          awk -F'\t' 'FILENAME == ARGV[1] { seen[$0] = 1; next } !seen[$1 FS $2 FS $3 FS $4]' "$RUNNER_TEMP/base.keys" "$RUNNER_TEMP/head.tsv" > "$RUNNER_TEMP/new.tsv"
          echo "High-severity findings already in the base, ignored: $(( $(wc -l < "$RUNNER_TEMP/head.tsv") - $(wc -l < "$RUNNER_TEMP/new.tsv") ))"
          if [ -s "$RUNNER_TEMP/new.tsv" ]; then
            echo "::error::This pull request adds high-severity GitHub Actions issues (rule, file:line, finding):"
            awk -F'\t' '{ printf "  %s  %s:%s  %s\n", $1, $2, $5, $4 }' "$RUNNER_TEMP/new.tsv"
            echo "Each rule is explained at https://docs.zizmor.sh/audits/"
            exit 1
          fi
          echo "No new high-severity GitHub Actions issues."
      # Report only: high-severity issues in all of the repo's workflow and action files, less any the
      # pull request adds (the step above fails on those).
      - name: List issues already on the base branch (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' ':(glob)**/action.yml' ':(glob)**/action.yaml')
          if [ "${#files[@]}" -eq 0 ]; then echo "No workflow or action files."; exit 0; fi
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format json --min-severity high --no-exit-codes "${files[@]}" \
            | jq -r -f "$RUNNER_TEMP/findings.jq" | sort -u > "$RUNNER_TEMP/all.tsv"
          touch "$RUNNER_TEMP/new.tsv"
          cut -f1-4 "$RUNNER_TEMP/new.tsv" | sort -u > "$RUNNER_TEMP/new.keys"
          awk -F'\t' 'FILENAME == ARGV[1] { added[$0] = 1; next } !added[$1 FS $2 FS $3 FS $4]' "$RUNNER_TEMP/new.keys" "$RUNNER_TEMP/all.tsv" > "$RUNNER_TEMP/existing.tsv"
          count=$(wc -l < "$RUNNER_TEMP/existing.tsv" | tr -d ' ')
          if [ "$count" -eq 0 ]; then echo "No high-severity GitHub Actions issues already on ${BASE_NAME}."; exit 0; fi
          {
            echo "### GitHub Actions issues already on ${BASE_NAME} (not blocking)"
            echo
            echo "${count} high-severity zizmor findings. This pull request didn't add them, so they don't fail the check. Fix them in their own pull request. Each rule is explained at https://docs.zizmor.sh/audits/"
            echo
            echo "| Rule | File | Finding |"
            echo "|---|---|---|"
            head -50 "$RUNNER_TEMP/existing.tsv" | awk -F'\t' '{ gsub(/\|/, "\\|", $4); printf "| %s | %s:%s | %s |\n", $1, $2, $5, $4 }'
            if [ "$count" -gt 50 ]; then echo; echo "And $((count - 50)) more."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Existing GitHub Actions issues::${count} high-severity GitHub Actions issues are already on ${BASE_NAME}. Not blocking. They're listed in the run summary."

  # High and critical misconfigurations in infrastructure files: Terraform, Dockerfiles, Kubernetes,
  # Helm, CloudFormation and ARM templates (Trivy does not read Bicep). Trivy scans the base and the
  # pull request, and the job fails only on findings the pull request adds. Accept a checked finding
  # in the repo's `.trivyignore`.
  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      - name: Check out the base alongside
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
      - name: Trivy on the pull request
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/head.json
          exit-code: "0"
          hide-progress: true
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Trivy on the base
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          scan-type: config
          scan-ref: ${{ runner.temp }}/base
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/base.json
          exit-code: "0"
          hide-progress: true
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Fail on misconfigurations the pull request adds
        run: |
          list() { jq -r '.Results[]? | .Target as $t | .Misconfigurations[]? | "\($t)\t\(.ID)\t\(.Severity)\t\(.Title)"' "$1" | sort -u; }
          list "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/head.txt"
          list "$RUNNER_TEMP/base.json" > "$RUNNER_TEMP/base.txt"
          comm -23 "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/base.txt" > "$RUNNER_TEMP/new.txt"
          if [ -s "$RUNNER_TEMP/new.txt" ]; then
            echo "::error::This pull request adds high or critical infrastructure misconfigurations (file, check, severity, title):"
            cat "$RUNNER_TEMP/new.txt"
            exit 1
          fi
          echo "No new high or critical infrastructure misconfigurations."
      # Report only: misconfigurations in both scans above, so already on the base branch and still
      # there after the pull request.
      - name: List misconfigurations already on the base branch (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -s "$RUNNER_TEMP/head.txt" ] || [ ! -f "$RUNNER_TEMP/base.txt" ]; then echo "Nothing to report."; exit 0; fi
          comm -12 "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/base.txt" > "$RUNNER_TEMP/existing.txt"
          count=$(wc -l < "$RUNNER_TEMP/existing.txt" | tr -d ' ')
          if [ "$count" -eq 0 ]; then echo "No high or critical misconfigurations already on ${BASE_NAME}."; exit 0; fi
          critical=$(awk -F'\t' '$3 == "CRITICAL"' "$RUNNER_TEMP/existing.txt" | wc -l | tr -d ' ')
          {
            echo "### Infrastructure misconfigurations already on ${BASE_NAME} (not blocking)"
            echo
            echo "${critical} critical and $((count - critical)) high. This pull request didn't add them, so they don't fail the check. Fix them in their own pull request."
            echo
            echo "| Severity | Check | File | Finding |"
            echo "|---|---|---|---|"
            sort -t$'\t' -k3,3 "$RUNNER_TEMP/existing.txt" | head -50 | awk -F'\t' '{ gsub(/\|/, "\\|", $4); printf "| %s | %s | %s | %s |\n", $3, $2, $1, $4 }'
            if [ "$count" -gt 50 ]; then echo; echo "And $((count - 50)) more."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Existing infrastructure misconfigurations::${critical} critical and $((count - critical)) high infrastructure misconfigurations are already on ${BASE_NAME}. Not blocking. They're listed in the run summary."

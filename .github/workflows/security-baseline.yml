# Security baseline: the checks every pull request must pass, required org-wide by the
# `security-baseline` org ruleset. It can also be called with workflow_call, to try it in a repo
# before the ruleset applies there.
#
# It has to work on any stack with no set-up, and it blocks only on problems a pull request adds:
# every job compares the pull request with its base, so existing issues never turn an unrelated pull
# request red. Repos add their own, stricter checks alongside it. Per-repo tuning lives in each repo's
# own files (`.trivyignore`, `nosemgrep` comments, `osv-scanner.toml`), so it is reviewed like any change.
#
# Every action is pinned to a commit and the Semgrep image to a digest, each with its version in a
# comment. The tools some actions fetch (TruffleHog's and OSV-Scanner's images, zizmor and the Trivy
# binary) are pinned by version only. Tags can be moved: in March 2026, 76 of the 77 trivy-action tags
# were hijacked to steal CI secrets (CVE-2026-33634). Bump pins deliberately, and update the ruleset's
# pinned commit to match.
name: Security baseline

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

# github.workflow keeps the ruleset's run and a repo's own workflow_call run in separate groups, so
# neither cancels the other.
concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The event's base and head. The base recorded on a pull request can be behind the branch it targets,
# while the checked-out merge commit is built on that branch's current tip, so each job takes its base
# from the merge commit instead ("Find the base") and falls back to this only where there is no merge
# commit, as in a merge queue.
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  # Live and unverifiable secrets in the pull request's commits. Keys that fail verification, such as
  # revoked keys or test fixtures, are not reported. The org push ruleset and the repo-guardrails hook
  # catch secret files and known key formats earlier.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          base: ${{ env.BASE }}
          head: ${{ env.HEAD_SHA }}
          version: 3.99.8
          extra_args: --results=verified,unknown

  # Semgrep's default rules, high severity only, and only the findings the pull request adds. Mark a
  # checked false positive with a `nosemgrep` comment. Workflow files are left to the workflows job.
  code:
    name: code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 # 1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      - name: Semgrep
        run: |
          semgrep scan --config p/default --severity ERROR --baseline-commit "$BASE" --error --metrics off --exclude .github/workflows

  # Known vulnerabilities in dependencies. OSV-Scanner scans the base and the pull request and fails only
  # on vulnerabilities the pull request adds; Dependabot handles the ones already there. Results go to
  # the job log and annotations, as private repos cannot take SARIF without GitHub Code Security. In a
  # merge queue it has no base branch to compare with and reports nothing new, so the pull request run
  # is the one that counts. Repos with no dependency files pass. `security-events: write` is granted only
  # because OSV-Scanner's reusable workflow declares it on its job; SARIF upload is off.
  dependencies:
    name: dependencies
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      scan-args: |-
        --recursive
        --allow-no-lockfiles
        ./

  # GitHub Actions security (script injection, risky triggers, over-broad permissions, unpinned
  # actions). zizmor audits the base and pull request versions of each workflow or action file the
  # pull request adds or changes, and the job fails only on high-severity findings that are new.
  # Findings are matched on rule, file, YAML location and message, not line number, so an edit
  # elsewhere in a file doesn't turn the file's existing findings into new ones.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      # Compare the base with the checked-out merge commit, not the branch head, so only the pull
      # request's own changes count even when its branch is behind the base.
      - name: List changed workflow and action files
        id: changed
        run: |
          files=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- \
            '.github/workflows/*.yml' '.github/workflows/*.yaml' ':(glob)**/action.yml' ':(glob)**/action.yaml' | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "Changed: ${files:-none}"
      - name: Install zizmor
        if: steps.changed.outputs.files != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --disable-pip-version-check zizmor==1.32.0
      - name: zizmor, failing only on findings the pull request adds
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          FILES: ${{ steps.changed.outputs.files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor="$RUNNER_TEMP/zizmor/bin/zizmor"
          base_dir="$RUNNER_TEMP/zizmor-base"
          read -r -a files <<< "$FILES"
          # The base version of each changed file that existed before, at the same relative path.
          base_files=()
          for f in "${files[@]}"; do
            if git cat-file -e "$BASE:$f" 2>/dev/null; then
              mkdir -p "$base_dir/$(dirname "$f")"
              git show "$BASE:$f" > "$base_dir/$f"
              base_files+=("$f")
            fi
          done
          # One line per high-severity finding: rule, file, YAML route and message (the match key),
          # then the line number for the report.
          findings() {
            jq -r '.[] | select(.determinations.severity == "High") | . as $f
              | ([$f.locations[] | select(.symbolic.kind == "Primary")] + $f.locations)[0] as $l
              | [$f.ident, $l.symbolic.key.Local.verbatim_path, ($l.symbolic.route | tostring),
                 $l.symbolic.annotation, ($l.concrete.location.start_point.row + 1 | tostring)] | @tsv'
          }
          "$zizmor" --format json --min-severity high --no-exit-codes "${files[@]}" | findings > "$RUNNER_TEMP/head.tsv"
          : > "$RUNNER_TEMP/base.tsv"
          if [ "${#base_files[@]}" -gt 0 ]; then
            (cd "$base_dir" && "$zizmor" --format json --min-severity high --no-exit-codes "${base_files[@]}") | findings > "$RUNNER_TEMP/base.tsv"
          fi
          cut -f1-4 "$RUNNER_TEMP/base.tsv" | sort -u > "$RUNNER_TEMP/base.keys"
          awk -F'\t' 'NR == FNR { seen[$0] = 1; next } !seen[$1 FS $2 FS $3 FS $4]' "$RUNNER_TEMP/base.keys" "$RUNNER_TEMP/head.tsv" > "$RUNNER_TEMP/new.tsv"
          echo "High-severity findings already in the base, ignored: $(( $(wc -l < "$RUNNER_TEMP/head.tsv") - $(wc -l < "$RUNNER_TEMP/new.tsv") ))"
          if [ -s "$RUNNER_TEMP/new.tsv" ]; then
            echo "::error::This pull request adds high-severity GitHub Actions issues (rule, file:line, finding):"
            awk -F'\t' '{ printf "  %s  %s:%s  %s\n", $1, $2, $5, $4 }' "$RUNNER_TEMP/new.tsv"
            echo "Each rule is explained at https://docs.zizmor.sh/audits/"
            exit 1
          fi
          echo "No new high-severity GitHub Actions issues."

  # High and critical misconfigurations in infrastructure files: Terraform, Dockerfiles, Kubernetes,
  # Helm, CloudFormation and ARM templates (Trivy does not read Bicep). Trivy scans the base and the
  # pull request, and the job fails only on findings the pull request adds. Accept a checked finding
  # in the repo's `.trivyignore`.
  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git rev-parse -q --verify HEAD^2 >/dev/null; then base=$(git rev-parse HEAD^1); else base="$BASE_SHA"; fi
          echo "BASE=${base}" >> "$GITHUB_ENV"
          echo "Comparing with ${base}"
      - name: Check out the base alongside
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
      - name: Trivy on the pull request
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/head.json
          exit-code: "0"
          hide-progress: true
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Trivy on the base
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          skip-setup-trivy: true
          scan-type: config
          scan-ref: ${{ runner.temp }}/base
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/base.json
          exit-code: "0"
          hide-progress: true
          cache-dir: ${{ runner.temp }}/trivy-cache
      - name: Fail on misconfigurations the pull request adds
        run: |
          list() { jq -r '.Results[]? | .Target as $t | .Misconfigurations[]? | "\($t)\t\(.ID)\t\(.Severity)\t\(.Title)"' "$1" | sort -u; }
          list "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/head.txt"
          list "$RUNNER_TEMP/base.json" > "$RUNNER_TEMP/base.txt"
          comm -23 "$RUNNER_TEMP/head.txt" "$RUNNER_TEMP/base.txt" > "$RUNNER_TEMP/new.txt"
          if [ -s "$RUNNER_TEMP/new.txt" ]; then
            echo "::error::This pull request adds high or critical infrastructure misconfigurations (file, check, severity, title):"
            cat "$RUNNER_TEMP/new.txt"
            exit 1
          fi
          echo "No new high or critical infrastructure misconfigurations."

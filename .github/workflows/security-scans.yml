name: Security scans

on:
  workflow_call:
    inputs:
      semgrep-config:
        description: "Semgrep rule sets (space-separated)"
        required: false
        type: string
        default: p/security-audit p/secrets
      trivy-severity:
        # Blocking threshold for the APP-CODE scans (dependencies + container
        # image). Defaults to HIGH,CRITICAL: those findings are mostly in
        # transitive deps we can't always patch on our own timeline, so we only
        # fail the build on the serious ones and track MEDIUM/LOW via Dependabot.
        # The infra (config) scan is deliberately held to a stricter bar — see
        # the trivy-config job below.
        description: "Blocking severity for the dependency + image scans (app code)"
        required: false
        type: string
        default: HIGH,CRITICAL
      infra-path:
        description: "Path to infrastructure config for Trivy config scan"
        required: false
        type: string
        default: ./infra

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    # semgrep/semgrep-action is deprecated; run the semgrep CLI from its
    # published container instead. CE scan against rule packs, no token needed.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        # inputs.semgrep-config is a space-separated list of packs, but the
        # CLI wants one --config per pack, so expand it into repeated flags.
        # --error makes findings fail the job, matching the old action.
        run: |
          configs=""
          for c in ${{ inputs.semgrep-config }}; do
            configs="$configs --config=$c"
          done
          semgrep scan $configs --error

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.6
        with:
          extra_args: --only-verified

  # --- Trivy severity policy (two tiers) --------------------------------------
  # App code (deps + image): block on HIGH,CRITICAL only. Findings are mostly
  #   third-party/transitive and not always fixable by us immediately; MEDIUM/LOW
  #   are tracked and scheduled via Dependabot rather than blocking every PR.
  # Infra (config/IaC): block on MEDIUM,HIGH,CRITICAL. These are first-party
  #   files we own (Dockerfiles, Terraform, etc.) and are cheap to fix, so we
  #   hold them to a higher bar. LOW is excluded because Trivy's LOW misconfig
  #   checks are mostly best-practice lint, not security issues.
  # ----------------------------------------------------------------------------

  trivy-scan:
    name: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: ${{ inputs.trivy-severity }}  # app-code threshold (HIGH,CRITICAL)
          exit-code: 1

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy infra scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.infra-path }}
          # Infra is first-party and cheap to fix, so it's held to a stricter
          # bar than app code: block on MEDIUM and up (not just HIGH,CRITICAL).
          # Set explicitly — without this, trivy-action defaults to ALL
          # severities and LOW best-practice lint would fail the build too.
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: 1
        if: hashFiles('infra/**') != ''

  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        if: hashFiles('Dockerfile') != ''
      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
        if: hashFiles('Dockerfile') != ''
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}  # app-code threshold (HIGH,CRITICAL)
          exit-code: 1
        if: hashFiles('Dockerfile') != ''

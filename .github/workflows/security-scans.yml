name: Security scans

on:
  workflow_call:
    inputs:
      semgrep-config:
        description: "Semgrep rule sets (space-separated)"
        required: false
        type: string
        default: p/security-audit p/secrets
      trivy-severity:
        description: "Trivy severity threshold"
        required: false
        type: string
        default: HIGH,CRITICAL
      infra-path:
        description: "Path to infrastructure config for Trivy config scan"
        required: false
        type: string
        default: ./infra

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    # semgrep/semgrep-action is deprecated; run the semgrep CLI from its
    # published container instead. CE scan against rule packs, no token needed.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        # inputs.semgrep-config is a space-separated list of packs, but the
        # CLI wants one --config per pack, so expand it into repeated flags.
        # --error makes findings fail the job, matching the old action.
        run: |
          configs=""
          for c in ${{ inputs.semgrep-config }}; do
            configs="$configs --config=$c"
          done
          semgrep scan $configs --error

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.6
        with:
          extra_args: --only-verified

  trivy-scan:
    name: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: ${{ inputs.trivy-severity }}
          exit-code: 1

  trivy-config:
    name: trivy-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy infra scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.infra-path }}
          exit-code: 1
        if: hashFiles('infra/**') != ''

  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        if: hashFiles('Dockerfile') != ''
      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
        if: hashFiles('Dockerfile') != ''
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: 1
        if: hashFiles('Dockerfile') != ''

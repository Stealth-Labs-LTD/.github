name: Release

# Builds, scans, signs and pushes the image to GHCR. It deploys nothing: the
# caller chooses where the image goes (the "Internal release" template chains
# deploy-cloud-run.yml, which targets Stealth Labs' own stealthlabs-dev).
#
# Every action is pinned to a commit, with its version in a comment, and Trivy to a version. In
# March 2026, 76 of the 77 trivy-action tags were hijacked to steal CI secrets (CVE-2026-33634), and
# this job holds GHCR push and signing rights. Bump pins deliberately.
#
# Do not rename or move this file. Caller repos reference it by path
# (`.github/workflows/release.yml@main`), so a rename breaks their next tag.

on:
  workflow_call:
    inputs:
      trivy-severity:
        description: "Trivy severity threshold"
        required: false
        type: string
        default: HIGH,CRITICAL
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: ./Dockerfile

permissions:
  contents: write   # release-asset upload (SBOM attached to GitHub release)
  packages: write   # GHCR push + cosign attach
  id-token: write   # cosign keyless signing
  actions: read     # sbom-action downloads its own workflow artifact via the Actions API

jobs:
  build-and-push:
    name: Build, scan, sign, and push
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f ${{ inputs.dockerfile }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: 1

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          output-file: sbom.spdx.json

      - name: Attest SBOM to image
        # `cosign attach sbom` was deprecated in 2024-02 (sigstore/cosign#2755).
        # `cosign attest --predicate` produces a signed in-toto attestation
        # against the image digest — the modern equivalent. Verify with
        # `cosign verify-attestation --type spdxjson <image>`.
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

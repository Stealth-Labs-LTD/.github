name: Release

on:
  workflow_call:
    inputs:
      trivy-severity:
        description: "Trivy severity threshold"
        required: false
        type: string
        default: HIGH,CRITICAL
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: ./Dockerfile

permissions:
  contents: write   # release-asset upload (SBOM attached to GitHub release)
  packages: write   # GHCR push + cosign attach
  id-token: write   # cosign keyless signing
  actions: read     # sbom-action downloads its own workflow artifact via the Actions API

jobs:
  build-and-push:
    name: Build, scan, sign, and push
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f ${{ inputs.dockerfile }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: 1

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          output-file: sbom.spdx.json

      - name: Attest SBOM to image
        # `cosign attach sbom` was deprecated in 2024-02 (sigstore/cosign#2755).
        # `cosign attest --predicate` produces a signed in-toto attestation
        # against the image digest — the modern equivalent. Verify with
        # `cosign verify-attestation --type spdxjson <image>`.
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

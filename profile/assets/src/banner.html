  /* Values copied verbatim from the design system's tokens/*.css (v1.0.0) */
  :root {
    --sl-black: #000000; --sl-white: #FFFFFF; --sl-pink: #F193E9;
    --sl-ink-950: #0A0A0B; --sl-ink-700: #2A2A30; --sl-ink-500: #5C5C66; --sl-ink-300: #B4B4BC; --sl-ink-200: #D7D7DC;
    --sl-font-heading: 'Archivo', 'Aileron', system-ui, sans-serif;
    --sl-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --sl-tracking-tight: -0.02em; --sl-tracking-wide: 0.18em;
  }
  [data-theme="dark"]  { --bg: var(--sl-black); --text: var(--sl-white); --muted: var(--sl-ink-300); --rule: var(--sl-ink-700); }
  [data-theme="light"] { --bg: var(--sl-white); --text: var(--sl-ink-950); --muted: var(--sl-ink-500); --rule: var(--sl-ink-200); }
  html, body { margin: 0; }
  .canvas { position: relative; overflow: hidden; background: var(--bg); color: var(--text); width: 1280px; height: 440px; }
  .canvas.card { height: 640px; }

  /* Oversized S-chevron bleeding off-canvas: the brand's hero device (see brand/social_7.png) */
  .device { position: absolute; fill: var(--sl-pink); height: 660px; right: -190px; top: -110px; }
  .card .device { height: 760px; right: -350px; top: -60px; }

  .content { position: absolute; left: 80px; top: 72px; bottom: 60px; display: flex; flex-direction: column; }
  .wordmark { height: 50px; width: auto; display: block; }
  .wordmark.dark-only  { display: none; } [data-theme="dark"]  .wordmark.dark-only  { display: block; }
  .wordmark.light-only { display: none; } [data-theme="light"] .wordmark.light-only { display: block; }
  h1 { font-family: var(--sl-font-heading); font-weight: 900; text-transform: uppercase; letter-spacing: var(--sl-tracking-tight);
       font-size: 92px; line-height: 0.92; margin: auto 0 0; }
  .card h1 { font-size: 104px; }
  .kicker { font-family: var(--sl-font-mono); font-weight: 500; font-size: 17px; letter-spacing: var(--sl-tracking-wide);
            text-transform: uppercase; color: var(--muted); margin-top: 26px; }
  /* Wordmark-led variant: the logo is the headline */
  .big .wordmark { height: 176px; }
  .big h1 { display: none; }
  .big .content { justify-content: center; }
  .big .kicker { margin-top: 40px; font-size: 19px; }
  .card .kicker { font-size: 20px; margin-top: 36px; }
</style>

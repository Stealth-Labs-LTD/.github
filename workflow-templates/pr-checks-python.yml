name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: Stealth-Labs-LTD/.github/.github/workflows/security-scans.yml@main
    with:
      semgrep-config: p/python p/security-audit p/secrets

  lint-and-test:
    uses: Stealth-Labs-LTD/.github/.github/workflows/lint-and-test.yml@main
    with:
      language: python
      language-version: "3.12"

  preview:
    needs: [lint-and-test]
    uses: Stealth-Labs-LTD/.github/.github/workflows/deploy-cloud-run.yml@main
    with:
      service_name: ${{ github.event.repository.name }}-pr-${{ github.event.pull_request.number }}
      # Uncomment to set the Cloud Run runtime SA for preview deploys. Needed
      # if the app authenticates to GCP APIs at runtime (Cloud Run, BigQuery,
      # Cloud SQL via IAM, etc.). Create the SA and grant the minimum role
      # once via gcloud or Terraform before enabling. POC apps that only
      # call external HTTP APIs don't need this — the default Compute SA
      # is fine.
      # runtime_service_account: myapp-preview@stealthlabs-dev.iam.gserviceaccount.com
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Pass the caller's repo secrets so APP_-prefixed ones get auto-injected as Cloud Run env vars.
      all_secrets: ${{ toJSON(secrets) }}

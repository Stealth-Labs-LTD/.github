name: Deploy to Azure

# Deploys to an Azure Container App on every push to the default branch, signing in keyless.
# Set-up (once per repo): README of Stealth-Labs-LTD/.github, "deploy-azure-container-app.yml".
# Fill in the four values below, and add the repo variables AZURE_CLIENT_ID and AZURE_SUBSCRIPTION_ID.
on:
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Stealth-Labs-LTD/.github/.github/workflows/deploy-azure-container-app.yml@main
    with:
      environment: staging
      client_id: ${{ vars.AZURE_CLIENT_ID }}
      subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource_group: rg-my-app-staging
      container_app: my-app-staging
      registry: myappregistry

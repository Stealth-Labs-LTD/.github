name: Internal release

# Internal release only. A v* tag builds the image and deploys it to Stealth
# Labs' own Cloud Run (the stealthlabs-dev project by default). It's for proofs
# of concept, demos and internal tools that hold public or internal data only.
# Nothing here deploys to a customer's environment: customer deliveries need
# their own pipeline, and HQ apps run on Azure.
#
# Every service gets the org's shared OPENROUTER_API_KEY. To give this app its
# own key and spending limit, set a repo secret with the same name: it takes
# precedence over the org secret.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # release-asset upload (SBOM attached to GitHub release)
  packages: write   # GHCR push + cosign attach
  id-token: write   # cosign keyless signing
  actions: read     # sbom-action downloads its own workflow artifact via the Actions API

jobs:
  release:
    uses: Stealth-Labs-LTD/.github/.github/workflows/release.yml@main

  deploy:
    needs: [release]
    uses: Stealth-Labs-LTD/.github/.github/workflows/deploy-cloud-run.yml@main
    # Uncomment to set the Cloud Run runtime SA. Needed if the app authenticates
    # to GCP APIs at runtime (Cloud Run, BigQuery, Cloud SQL via IAM, etc.).
    # Create the SA and grant the minimum role once via gcloud or Terraform
    # before enabling. POC apps that only call external HTTP APIs don't need
    # this — the default Compute SA is fine.
    # with:
    #   runtime_service_account: myapp-runtime@stealthlabs-dev.iam.gserviceaccount.com
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Pass the caller's repo secrets so APP_-prefixed ones get auto-injected as Cloud Run env vars.
      all_secrets: ${{ toJSON(secrets) }}

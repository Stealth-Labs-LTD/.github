name: PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Required: the reusable workflow needs these, and a called workflow cannot be
    # granted more than the caller holds, so they must be declared here (id-token in
    # particular is never on by default). Without this the run fails at startup.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: Stealth-Labs-LTD/.github/.github/workflows/pr-review.yml@main
    # Optional overrides — the values below are the defaults, shown so you can see
    # the knobs. Delete any line to keep its default.
    with:
      model: claude-opus-4-8      # cheaper: claude-sonnet-5 · fastest: claude-haiku-4-5-20251001
      persona: stealth-labs       # a persona skill in the pr-review plugin (ai-dev-kit)
      review_drafts: false        # true = also review draft PRs
    secrets: inherit              # needs CLAUDE_CODE_OAUTH_TOKEN + SL_AI_DEV_KIT_APP_ID / SL_AI_DEV_KIT_APP_KEY
